<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Javaのオブジェクト指向設計演習で制作した、ひつじの育成シミュレーションゲームのWeb版です。">
  <title>ひつじの育成ゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" aria-labelledby="game-title">
    <header class="header">
      <div>
        <p class="eyebrow">PET NURTURING GAME</p>
        <h1 id="game-title">ひつじの育成ゲーム</h1>
      </div>
      <button id="reset-btn" class="text-button" type="button" title="最初から始める">最初から</button>
    </header>

    <section class="status" aria-live="polite">
      <div class="pet-name" id="pet-name">ひつじ</div>
      <div class="stats">
        <div class="stat"><span>年齢</span><strong id="age">0</strong><small>日</small></div>
        <div class="stat"><span>満腹度</span><strong id="hunger">5</strong><small>/ 10</small></div>
        <div class="stat"><span>幸福度</span><strong id="happiness">5</strong><small>/ 10</small></div>
      </div>
      <div class="meters">
        <div class="meter-row"><span>満腹度</span><div class="meter"><i id="hunger-meter"></i></div></div>
        <div class="meter-row"><span>幸福度</span><div class="meter happiness"><i id="happiness-meter"></i></div></div>
      </div>
    </section>

    <section class="scene" aria-label="ひつじの様子">
      <div class="speech hidden" id="speech" aria-live="polite">
        <img src="assets/fukidashi.png" alt="">
        <div class="speech-content"><img src="assets/sad.png" alt=""><span id="speech-text"></span></div>
      </div>
      <img class="sheep" id="sheep" src="assets/Sheep.png" alt="元気なひつじ">
      <div class="dead-message hidden" id="dead-message">天国へ行きました…</div>
    </section>

    <section class="controls" aria-label="お世話の操作">
      <button class="action feed" id="feed-btn" type="button"><span class="action-icon">🥕</span><span>ごはん</span><small>満腹度 +3</small></button>
      <button class="action play" id="play-btn" type="button"><span class="action-icon">🎾</span><span>遊ぶ</span><small>幸福度 +3 / 満腹度 -2</small></button>
      <button class="action sleep" id="sleep-btn" type="button"><span class="action-icon">🌙</span><span>寝る</span><small>1日経過</small></button>
    </section>

    <footer class="footer">
      <p id="message" role="status">ひつじのお世話をしてあげよう！</p>
      <button id="save-btn" class="save-button" type="button">セーブする</button>
    </footer>
  </main>

  <dialog id="name-dialog">
    <form method="dialog" id="name-form">
      <p class="dialog-eyebrow">WELCOME</p>
      <h2>ひつじの名前を決めよう！</h2>
      <label for="name-input">名前</label>
      <input id="name-input" maxlength="12" placeholder="ひつじ" autocomplete="off">
      <div class="dialog-actions"><button value="start" class="primary">ゲームを始める</button></div>
    </form>
  </dialog>

  <dialog id="load-dialog">
    <form method="dialog">
      <p class="dialog-eyebrow">WELCOME BACK</p>
      <h2>前回の続きから遊びますか？</h2>
      <p class="dialog-note">保存データがある場合は、続きから再開できます。</p>
      <div class="dialog-actions"><button value="new" class="secondary">新しく始める</button><button value="load" class="primary">続きから遊ぶ</button></div>
    </form>
  </dialog>

  <dialog id="notice-dialog">
    <form method="dialog">
      <p id="notice-text" class="notice-text"></p>
      <div class="dialog-actions"><button class="primary" value="ok">OK</button></div>
    </form>
  </dialog>

  <script src="game.js"></script>
</body>
</html>
